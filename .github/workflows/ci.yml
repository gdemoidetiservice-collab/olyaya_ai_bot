name: Olyaya Bot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile bot.py
          python -m py_compile ai.py
          python -m py_compile config.py
          python -m py_compile scheduler.py
          python -m py_compile memory.py
          python -m py_compile weather.py
          python -m py_compile calendar_utils.py
          python -m py_compile excel_utils.py
          python -m py_compile prompts.py
          echo "All files OK"

      - name: Build Docker image
        run: docker build -t olyaya-bot .
